<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Anniversary!</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #0f172a 0%, #090d16 70%, #030712 100%);
      padding: 20px 15px;
      overflow: hidden;
      position: relative;
    }

    /* خلفية القلوب المتحركة */
    .bg-hearts {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .heart-particle {
      position: absolute;
      bottom: -10%;
      font-size: 1.2rem;
      animation: floatUp linear infinite;
      opacity: 0.6;
      filter: drop-shadow(0 0 6px currentColor);
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg) scale(0.8);
        opacity: 0;
      }
      20% {
        opacity: 0.6;
      }
      80% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(-110vh) rotate(360deg) scale(1.2);
        opacity: 0;
      }
    }

    /* الكرت الرئيسي */
    .container {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 45px 30px;
      max-width: 480px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 35px rgba(244, 162, 97, 0.15);
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .title {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 600;
      background: linear-gradient(135deg, #ffffff 0%, #f4a261 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #94a3b8;
      font-weight: 300;
      line-height: 1.6;
      margin-bottom: 35px;
      letter-spacing: 0.2px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 25px;
    }

    /* أزرار الهدايا */
    .card-btn {
      background: rgba(255, 255, 255, 0.04);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 32px 15px;
      font-size: 1.7rem;
      cursor: pointer;
      transition: all 0.35 cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .card-btn::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(244, 162, 97, 0.2) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .card-btn:hover {
      background: rgba(42, 157, 143, 0.18);
      border-color: rgba(42, 157, 143, 0.6);
      color: #2a9d8f;
      transform: translateY(-5px) scale(1.03);
      box-shadow: 0 12px 25px rgba(42, 157, 143, 0.25);
    }

    .card-btn:hover::before {
      opacity: 1;
    }

    .card-btn:active {
      transform: scale(0.95);
    }

    .card-btn.visited {
      border-color: rgba(244, 162, 97, 0.7);
      color: #f4a261;
      background: rgba(244, 162, 97, 0.15);
      box-shadow: 0 6px 20px rgba(244, 162, 97, 0.2);
    }

    .page {
      display: none !important;
    }

    .page.active {
      display: block !important;
      animation: popIn 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.92) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* ENVELOPE DESIGN */
    .envelope-wrapper {
      margin: 40px 0;
    }

    .envelope-interactive {
      width: 120px;
      height: 85px;
      margin: 0 auto;
      cursor: pointer;
      position: relative;
      background: #2a1f1d;
      border-radius: 14px;
      border: 1px solid rgba(244, 162, 97, 0.4);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f4a261;
      font-size: 1.8rem;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
      animation: pulseGlow 2s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(244, 162, 97, 0.2); }
      50% { box-shadow: 0 0 25px rgba(244, 162, 97, 0.5); }
    }

    .envelope-interactive:hover {
      transform: translateY(-6px) scale(1.08);
      border-color: #f4a261;
      color: #ffffff;
      background: #f4a261;
    }

    .envelope-interactive:active {
      transform: scale(0.95);
    }

    .letter-content {
      display: none;
      text-align: left;
      background: rgba(42, 31, 29, 0.7);
      padding: 30px;
      border-radius: 18px;
      margin: 25px 0 35px;
      max-height: 320px;
      overflow-y: auto;
      border: 1px solid rgba(244, 162, 97, 0.3);
      animation: popIn 0.4s ease;
    }

    .letter-text {
      font-size: 0.95rem;
      line-height: 1.8;
      color: #e2e8f0;
      font-weight: 300;
      white-space: pre-line;
    }

    /* REASON GENERATOR BOX */
    .reason-box {
      background: rgba(42, 157, 143, 0.1);
      border: 1.5px dashed rgba(42, 157, 143, 0.5);
      padding: 35px 25px;
      border-radius: 18px;
      font-size: 1rem;
      color: #f8fafc;
      font-weight: 300;
      line-height: 1.6;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 30px 0;
      transition: all 0.3s ease;
      box-shadow: inset 0 0 15px rgba(42, 157, 143, 0.1);
    }

    /* VINYL PLAYER */
    .vinyl-container {
      margin: 35px auto;
      width: 170px;
      height: 170px;
    }

    .vinyl-record {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, #1e293b 18%, #090d16 20%, #171e2e 40%, #090d16 60%, #171e2e 80%, #020617 100%);
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      justify-content: center;
      align-items: center;
      animation: spin 4s linear infinite;
      animation-play-state: paused;
      transition: box-shadow 0.4s ease;
    }

    .vinyl-record.playing {
      animation-play-state: running;
      box-shadow: 0 0 35px rgba(244, 162, 97, 0.4);
    }

    .vinyl-center {
      width: 52px;
      height: 52px;
      background: #0f172a;
      border-radius: 50%;
      border: 2px solid rgba(244, 162, 97, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #f4a261;
      font-size: 0.95rem;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* BUTTONS */
    .action-btn {
      background: linear-gradient(135deg, #f4a261 0%, #e76f51 100%);
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-bottom: 12px;
      width: 100%;
      box-shadow: 0 6px 20px rgba(231, 111, 81, 0.3);
    }

    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(231, 111, 81, 0.45);
      background: linear-gradient(135deg, #f5b078 0%, #f4a261 100%);
    }

    .action-btn:active {
      transform: scale(0.97);
    }

    .back-btn {
      background: transparent;
      color: #64748b;
      border: 1px solid transparent;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 5px;
    }

    .back-btn:hover {
      color: #cbd5e1;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <!-- القلوب المتحركة بالخلفية -->
  <div class="bg-hearts" id="hearts-container"></div>

  <div class="container">
    
    <!-- HOME PAGE -->
    <div id="home-page" class="page active">
      <h1 class="title">HAPPY ANNIVERSARY! <i class="fa-solid fa-heart" style="font-size: 1.5rem; color: #f4a261;"></i></h1>
      <p class="subtitle">Happy anniversary for my one and only love!</p>

      <div class="grid">
        <button class="card-btn" id="btn-1" onclick="openGift(1)">
          <i class="fa-regular fa-envelope"></i>
        </button>
        <button class="card-btn" id="btn-2" onclick="openSpotify()">
          <i class="fa-brands fa-spotify"></i>
        </button>
        <button class="card-btn" id="btn-3" onclick="openGift(3)">
          <i class="fa-regular fa-compass"></i>
        </button>
        <button class="card-btn" id="btn-4" onclick="openGift(4)">
          <i class="fa-solid fa-compact-disc"></i>
        </button>
      </div>
    </div>

    <!-- PAGE 1: LETTER -->
    <div id="page-1" class="page">
      <h1 class="title" style="text-transform: none;">The Note <i class="fa-solid fa-heart" style="font-size: 1.4rem; color: #f4a261;"></i></h1>
      
      <div id="envelope-wrapper" class="envelope-wrapper">
        <div class="envelope-interactive" onclick="openLetterAnimation()">
          <i class="fa-regular fa-envelope-open"></i>
        </div>
        <p class="subtitle" style="margin-top: 15px; margin-bottom: 0;">Tap to open with love</p>
      </div>

      <div id="letter-content" class="letter-content">
        <p class="letter-text">
          Write your note here...
        </p>
      </div>

      <button class="back-btn" onclick="goHome()">Back to Home</button>
    </div>

    <!-- PAGE 3: WHY YOU -->
    <div id="page-3" class="page">
      <h1 class="title" style="text-transform: none;">Why You? <i class="fa-solid fa-heart" style="font-size: 1.4rem; color: #2a9d8f;"></i></h1>
      <p class="subtitle">A few reasons among many</p>
      
      <div class="reason-box" id="reason-display">
        Click below to reveal
      </div>

      <button class="action-btn" onclick="generateReason()">Reveal Reason</button>
      <button class="back-btn" onclick="goHome()">Back to Home</button>
    </div>

    <!-- PAGE 4: VOICE MESSAGE -->
    <div id="page-4" class="page">
      <h1 class="title" style="text-transform: none;">A message for you <i class="fa-solid fa-heart" style="font-size: 1.4rem; color: #f4a261;"></i></h1>

      <div class="vinyl-container">
        <div class="vinyl-record" id="vinyl">
          <div class="vinyl-center">
            <i class="fa-solid fa-music"></i>
          </div>
        </div>
      </div>

      <audio id="voice-audio" src="YOUR_AUDIO_URL_HERE"></audio>

      <button class="action-btn" id="play-btn" onclick="toggleAudio()">Play Message</button>
      <button class="back-btn" onclick="goHome()">Back to Home</button>
    </div>

  </div>

  <script>
    // إنشاء القلوب المتحركة بالخلفية تلقائياً بالألوان المطلوبة
    const heartsContainer = document.getElementById('hearts-container');
    const heartColors = ['#f4a261', '#2a9d8f', '#e76f51', '#3b82f6'];

    function createHeart() {
      const heart = document.createElement('i');
      heart.classList.add('fa-solid', 'fa-heart', 'heart-particle');
      
      const randomColor = heartColors[Math.floor(Math.random() * heartColors.length)];
      const randomLeft = Math.random() * 100;
      const randomDuration = Math.random() * 4 + 5; // بين 5 إلى 9 ثواني
      const randomSize = Math.random() * 12 + 10; // حجم القلوب

      heart.style.color = randomColor;
      heart.style.left = randomLeft + '%';
      heart.style.animationDuration = randomDuration + 's';
      heart.style.fontSize = randomSize + 'px';

      heartsContainer.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, randomDuration * 1000);
    }

    setInterval(createHeart, 450);

    const visitedGifts = new Set();

    function openGift(id) {
      visitedGifts.add(id);
      document.getElementById('btn-' + id).classList.add('visited');
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('page-' + id).classList.add('active');
    }

    function openSpotify() {
      visitedGifts.add(2);
      document.getElementById('btn-2').classList.add('visited');
      window.open('YOUR_SPOTIFY_URL_HERE', '_blank');
    }

    function goHome() {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('home-page').classList.add('active');
      pauseAudio();
    }

    function openLetterAnimation() {
      document.getElementById('envelope-wrapper').style.display = 'none';
      document.getElementById('letter-content').style.display = 'block';
    }

    const reasons = [
      "Because your smile makes my whole day bright.",
      "Because our inside jokes are unmatched.",
      "Because you understand me with just one look.",
      "Because you always listen to my random stories.",
      "Because life is simply better with you around."
    ];

    function generateReason() {
      const randomIndex = Math.floor(Math.random() * reasons.length);
      const display = document.getElementById('reason-display');
      display.style.opacity = '0';
      display.style.transform = 'scale(0.95)';
      setTimeout(() => {
        display.innerText = reasons[randomIndex];
        display.style.opacity = '1';
        display.style.transform = 'scale(1)';
      }, 200);
    }

    const audio = document.getElementById('voice-audio');
    const vinyl = document.getElementById('vinyl');
    const playBtn = document.getElementById('play-btn');

    function toggleAudio() {
      if (audio.paused) {
        audio.play();
        vinyl.classList.add('playing');
        playBtn.innerText = 'Pause Message';
      } else {
        pauseAudio();
      }
    }

    function pauseAudio() {
      audio.pause();
      vinyl.classList.remove('playing');
      playBtn.innerText = 'Play Message';
    }

    audio.onended = function() {
      vinyl.classList.remove('playing');
      playBtn.innerText = 'Play Message';
    };
  </script>
</body>
</html>
