<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Anniversary!</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* خلفية باللون الأزرق الغامق العميق (Midnight Navy) */
    body {
      font-family: 'Inter', sans-serif;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #0f172a 0%, #090d16 70%, #030712 100%);
      padding: 20px 15px;
      overflow-x: hidden;
    }

    /* الكرت الرئيسي بالأسود الفخم المصقول وتفاصيل بني زجاجية */
    .container {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 45px 30px;
      max-width: 480px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(42, 157, 143, 0.12);
      text-align: center;
      position: relative;
    }

    .title {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 600;
      color: #f8fafc;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #94a3b8;
      font-weight: 300;
      line-height: 1.6;
      margin-bottom: 35px;
      letter-spacing: 0.2px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 25px;
    }

    /* الأزرار بالأخضر الزمردي الأنيق والأسود */
    .card-btn {
      background: rgba(255, 255, 255, 0.03);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 32px 15px;
      font-size: 1.6rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-btn:hover {
      background: rgba(42, 157, 143, 0.15);
      border-color: rgba(42, 157, 143, 0.5);
      color: #2a9d8f;
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 10px 20px rgba(42, 157, 143, 0.2);
    }

    .card-btn:active {
      transform: scale(0.95);
    }

    /* عند زيارة الكرت يتحول للبرتقالي الدافئ الجذاب */
    .card-btn.visited {
      border-color: rgba(244, 162, 97, 0.6);
      color: #f4a261;
      background: rgba(244, 162, 97, 0.12);
      box-shadow: 0 5px 15px rgba(244, 162, 97, 0.15);
    }

    .page {
      display: none !important;
    }

    .page.active {
      display: block !important;
      animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* الظرف باللون البني الخشبي الدافئ العتيق */
    .envelope-wrapper {
      margin: 40px 0;
    }

    .envelope-interactive {
      width: 120px;
      height: 85px;
      margin: 0 auto;
      cursor: pointer;
      position: relative;
      background: #2a1f1d;
      border-radius: 12px;
      border: 1px solid rgba(244, 162, 97, 0.3);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f4a261;
      font-size: 1.6rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
    }

    .envelope-interactive:hover {
      transform: translateY(-5px) scale(1.05);
      border-color: #f4a261;
      color: #ffffff;
      background: #f4a261;
      box-shadow: 0 12px 25px rgba(244, 162, 97, 0.3);
    }

    .envelope-interactive:active {
      transform: scale(0.95);
    }

    .letter-content {
      display: none;
      text-align: left;
      background: rgba(42, 31, 29, 0.6);
      padding: 30px;
      border-radius: 16px;
      margin: 25px 0 35px;
      max-height: 320px;
      overflow-y: auto;
      border: 1px solid rgba(244, 162, 97, 0.2);
      animation: slideUpFade 0.4s ease;
    }

    .letter-text {
      font-size: 0.95rem;
      line-height: 1.8;
      color: #e2e8f0;
      font-weight: 300;
      white-space: pre-line;
    }

    /* مربع الأسباب بالأخضر الزمردي والتأثير الدافئ */
    .reason-box {
      background: rgba(42, 157, 143, 0.08);
      border: 1px dashed rgba(42, 157, 143, 0.4);
      padding: 35px 25px;
      border-radius: 16px;
      font-size: 1rem;
      color: #f8fafc;
      font-weight: 300;
      line-height: 1.6;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 30px 0;
      transition: all 0.3s ease;
    }

    /* اسطوانة الفاينل بالأسود الفخم المحسّن */
    .vinyl-container {
      margin: 35px auto;
      width: 170px;
      height: 170px;
    }

    .vinyl-record {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, #1e293b 18%, #090d16 20%, #171e2e 40%, #090d16 60%, #171e2e 80%, #020617 100%);
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      justify-content: center;
      align-items: center;
      animation: spin 4s linear infinite;
      animation-play-state: paused;
      transition: box-shadow 0.4s ease;
    }

    .vinyl-record.playing {
      animation-play-state: running;
      box-shadow: 0 0 30px rgba(244, 162, 97, 0.3);
    }

    .vinyl-center {
      width: 52px;
      height: 52px;
      background: #0f172a;
      border-radius: 50%;
      border: 2px solid rgba(244, 162, 97, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #f4a261;
      font-size: 0.9rem;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* الأزرار باللون البرتقالي الدافئ الفاخر */
    .action-btn {
      background: linear-gradient(135deg, #f4a261 0%, #e76f51 100%);
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-bottom: 12px;
      width: 100%;
      box-shadow: 0 6px 18px rgba(231, 111, 81, 0.25);
    }

    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(231, 111, 81, 0.4);
      background: linear-gradient(135deg, #f5b078 0%, #f4a261 100%);
    }

    .action-btn:active {
      transform: scale(0.97);
    }

    .back-btn {
      background: transparent;
      color: #64748b;
      border: 1px solid transparent;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 5px;
    }

    .back-btn:hover {
      color: #cbd5e1;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- HOME PAGE -->
    <div id="home-page" class="page active">
      <h1 class="title">HAPPY ANNIVERSARY!</h1>
      <p class="subtitle">Happy anniversary for my one and only love!</p>

      <div class="grid">
        <button class="card-btn" id="btn-1" onclick="openGift(1)">
          <i class="fa-regular fa-envelope"></i>
        </button>
        <button class="card-btn" id="btn-2" onclick="openSpotify()">
          <i class="fa-brands fa-spotify"></i>
        </button>
        <button class="card-btn" id="btn-3" onclick="openGift(3)">
          <i class="fa-regular fa-compass"></i>
        </button>
        <button class="card-btn" id="btn-4" onclick="openGift(4)">
          <i class="fa-solid fa-compact-disc"></i>
        </button>
      </div>
    </div>

    <!-- PAGE 1: LETTER -->
    <div id="page-1" class="page">
      <h1 class="title" style="text-transform: none;">The Note</h1>
      
      <div id="envelope-wrapper" class="envelope-wrapper">
        <div class="envelope-interactive" onclick="openLetterAnimation()">
          <i class="fa-regular fa-envelope-open"></i>
        </div>
        <p class="subtitle" style="margin-top: 15px; margin-bottom: 0;">Tap to read</p>
      </div>

      <div id="letter-content" class="letter-content">
        <p class="letter-text">
          Write your note here...
        </p>
      </div>

      <button class="back-btn" onclick="goHome()">Back to Home</button>
    </div>

    <!-- PAGE 3: WHY YOU -->
    <div id="page-3" class="page">
      <h1 class="title" style="text-transform: none;">Why You?</h1>
      <p class="subtitle">A few reasons among many</p>
      
      <div class="reason-box" id="reason-display">
        Click below to reveal
      </div>

      <button class="action-btn" onclick="generateReason()">Reveal Reason</button>
      <button class="back-btn" onclick="goHome()">Back to Home</button>
    </div>

    <!-- PAGE 4: VOICE MESSAGE -->
    <div id="page-4" class="page">
      <h1 class="title" style="text-transform: none;">A message for you</h1>

      <div class="vinyl-container">
        <div class="vinyl-record" id="vinyl">
          <div class="vinyl-center">
            <i class="fa-solid fa-music"></i>
          </div>
        </div>
      </div>

      <audio id="voice-audio" src="YOUR_AUDIO_URL_HERE"></audio>

      <button class="action-btn" id="play-btn" onclick="toggleAudio()">Play Message</button>
      <button class="back-btn" onclick="goHome()">Back to Home</button>
    </div>

  </div>

  <script>
    const visitedGifts = new Set();

    function openGift(id) {
      visitedGifts.add(id);
      document.getElementById('btn-' + id).classList.add('visited');
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('page-' + id).classList.add('active');
    }

    function openSpotify() {
      visitedGifts.add(2);
      document.getElementById('btn-2').classList.add('visited');
      window.open('YOUR_SPOTIFY_URL_HERE', '_blank');
    }

    function goHome() {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('home-page').classList.add('active');
      pauseAudio();
    }

    function openLetterAnimation() {
      document.getElementById('envelope-wrapper').style.display = 'none';
      document.getElementById('letter-content').style.display = 'block';
    }

    const reasons = [
      "Because your smile makes my whole day bright.",
      "Because our inside jokes are unmatched.",
      "Because you understand me with just one look.",
      "Because you always listen to my random stories.",
      "Because life is simply better with you around."
    ];

    function generateReason() {
      const randomIndex = Math.floor(Math.random() * reasons.length);
      const display = document.getElementById('reason-display');
      display.style.opacity = '0';
      display.style.transform = 'translateY(5px)';
      setTimeout(() => {
        display.innerText = reasons[randomIndex];
        display.style.opacity = '1';
        display.style.transform = 'translateY(0)';
      }, 200);
    }

    const audio = document.getElementById('voice-audio');
    const vinyl = document.getElementById('vinyl');
    const playBtn = document.getElementById('play-btn');

    function toggleAudio() {
      if (audio.paused) {
        audio.play();
        vinyl.classList.add('playing');
        playBtn.innerText = 'Pause Message';
      } else {
        pauseAudio();
      }
    }

    function pauseAudio() {
      audio.pause();
      vinyl.classList.remove('playing');
      playBtn.innerText = 'Play Message';
    }

    audio.onended = function() {
      vinyl.classList.remove('playing');
      playBtn.innerText = 'Play Message';
    };
  </script>
</body>
</html>
